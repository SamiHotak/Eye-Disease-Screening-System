name: ocular_screener
description: OSS - Ocular Screening System. Multi-label fundus disease screening, fully on-device.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model.tflite
    - assets/labels.txt
    - assets/thresholds.json
    - assets/model_info.json
    - assets/images/developer.jpg
